<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070B17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MoneyWise">
<title>MoneyWise</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"MoneyWise","short_name":"MoneyWise","start_url":".","display":"standalone","background_color":"%23070B17","theme_color":"%23070B17","orientation":"portrait","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27 viewBox%3D%270 0 512 512%27%3E%3Crect width%3D%27512%27 height%3D%27512%27 rx%3D%27110%27 fill%3D%27%23070B17%27%2F%3E%3Ctext x%3D%27256%27 y%3D%27345%27 text-anchor%3D%27middle%27 font-size%3D%27280%27%3E%F0%9F%92%B8%3C%2Ftext%3E%3C%2Fsvg%3E","sizes":"512x512","type":"image/svg+xml"}]}'>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27 viewBox%3D%270 0 512 512%27%3E%3Crect width%3D%27512%27 height%3D%27512%27 rx%3D%27110%27 fill%3D%27%23070B17%27%2F%3E%3Ctext x%3D%27256%27 y%3D%27345%27 text-anchor%3D%27middle%27 font-size%3D%27280%27%3E%F0%9F%92%B8%3C%2Ftext%3E%3C%2Fsvg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ── ROOT ── */
:root{
  --bg:#070B17;
  --surface:#0F1628;
  --surface2:#162035;
  --surface3:#1C2840;
  --border:#1F2E47;
  --border2:#263550;
  --accent:#F5A623;
  --accent-dim:rgba(245,166,35,.12);
  --accent-glow:rgba(245,166,35,.35);
  --green:#34D399;
  --green-dim:rgba(52,211,153,.1);
  --red:#F87171;
  --red-dim:rgba(248,113,113,.1);
  --blue:#60A5FA;
  --text:#DCE6FA;
  --text2:#6B7EA0;
  --text3:#2E3D5C;
  --r:18px;
  --rs:12px;
  --nav:62px;
  --fab:66px;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;
  width:100%;max-width:430px;margin:0 auto;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
#app{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* ── PAGE SYSTEM ── */
.page{
  position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px;
  padding-top:0;
  padding-bottom:calc(var(--nav) + var(--sb) + var(--fab) + 12px);
  opacity:0;pointer-events:none;transform:translateY(10px);
  transition:opacity .2s ease,transform .2s ease;
  scrollbar-width:none;
}
.page::-webkit-scrollbar{display:none;}
.page.active{opacity:1;pointer-events:all;transform:translateY(0);}

/* ── HEADER ── */
.hdr{
  padding:calc(var(--st) + 18px) 0 14px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,var(--bg) 80%,transparent);
  position:sticky;top:0;z-index:50;
}
.hdr-left{}
.hdr-wordmark{
  font-family:'Syne',sans-serif;font-weight:800;font-size:24px;
  letter-spacing:-.6px;color:var(--text);
}
.hdr-wordmark em{color:var(--accent);font-style:normal;}
.hdr-sub{font-size:11px;color:var(--text3);font-weight:500;margin-top:1px;}

/* ── BOTTOM NAV (3 items) ── */
.nav{
  background:rgba(10,14,28,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;
  padding-bottom:var(--sb);
  height:calc(var(--nav) + var(--sb));
  flex-shrink:0;position:relative;z-index:100;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;cursor:pointer;
  color:var(--text3);transition:color .15s;padding:8px 0;
  border:none;background:transparent;font-family:inherit;
}
.nav-item.active{color:var(--accent);}
.nav-item svg{width:21px;height:21px;stroke-width:1.8;transition:transform .15s;}
.nav-item.active svg{transform:scale(1.1);}
.nav-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;}
/* Middle placeholder so FAB doesn't overlap content */
.nav-mid{flex:1.4;}

/* ── FAB ── */
.fab{
  position:fixed;
  bottom:calc(var(--nav) + var(--sb) - 28px);
  left:50%;
  transform:translateX(-50%);
  width:var(--fab);height:var(--fab);
  background:var(--accent);
  border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 24px var(--accent-glow), 0 0 0 0 var(--accent-glow);
  z-index:200;
  transition:transform .15s,box-shadow .15s,background .15s;
  -webkit-tap-highlight-color:transparent;
}
.fab:active{transform:translateX(-50%) scale(.91);box-shadow:0 2px 12px rgba(245,166,35,.2);}
.fab.on-add-page{background:var(--surface2);box-shadow:none;border:1.5px solid var(--border2);}
.fab svg{width:26px;height:26px;stroke-width:2.5;transition:transform .2s;}
.fab.on-add-page svg{transform:rotate(45deg);}
.fab-ring{
  position:fixed;
  bottom:calc(var(--nav) + var(--sb) - 32px);
  left:50%;transform:translateX(-50%);
  width:calc(var(--fab) + 8px);height:calc(var(--fab) + 8px);
  border-radius:50%;
  border:1.5px solid rgba(245,166,35,.18);
  z-index:199;pointer-events:none;
}

/* ── CARDS ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;margin-bottom:10px;
}
.section-title{
  font-family:'Syne',sans-serif;font-weight:700;font-size:14px;
  margin-bottom:14px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;
}

/* ── BALANCE HERO ── */
.hero{
  background:linear-gradient(145deg,var(--surface),var(--surface2));
  border:1px solid var(--border2);
  border-radius:var(--r);padding:20px 18px 18px;
  margin-bottom:10px;position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;top:-60px;right:-40px;
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,166,35,.06) 0%,transparent 65%);
  pointer-events:none;
}
.hero-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.hero-amt{font-family:'Syne',sans-serif;font-size:42px;font-weight:800;line-height:1;letter-spacing:-1px;}
.hero-row{display:flex;gap:0;margin-top:16px;border-top:1px solid var(--border);padding-top:14px;}
.hero-stat{flex:1;display:flex;flex-direction:column;gap:3px;}
.hero-stat+.hero-stat{border-left:1px solid var(--border);padding-left:14px;margin-left:14px;}
.hero-stat-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:4px;}
.hero-stat-amt{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;}

/* ── MONTH NAV ── */
.month-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.month-btn{
  background:var(--surface2);border:1px solid var(--border);color:var(--text2);
  border-radius:9px;width:32px;height:32px;font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .15s,color .15s;
}
.month-btn:active{background:var(--surface3);}
.month-lbl{
  flex:1;text-align:center;font-family:'Syne',sans-serif;
  font-weight:700;font-size:14px;color:var(--text);
}

/* ── CATEGORY BARS ── */
.cat-bar{margin-bottom:13px;}
.cat-bar:last-child{margin-bottom:0;}
.cat-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.cat-bar-name{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;}
.cat-bar-ico{font-size:15px;line-height:1;}
.cat-bar-right{display:flex;align-items:center;gap:6px;}
.cat-bar-val{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;}
.cat-bar-pct{font-size:10px;font-weight:700;color:var(--text3);background:var(--surface2);padding:1px 5px;border-radius:4px;}
.cat-track{height:3px;background:var(--surface3);border-radius:99px;overflow:hidden;}
.cat-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1);}

/* ── TRANSACTION GROUPS ── */
.txn-grp{
  border-bottom:1px solid var(--border);
}
.txn-grp:last-child{border-bottom:none;}

.txn-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;cursor:pointer;
  position:relative;
}
.txn-ico{
  width:42px;height:42px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.txn-body{flex:1;min-width:0;}
.txn-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn-sub{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn-right{text-align:right;flex-shrink:0;}
.txn-amt{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;}
.txn-date{font-size:11px;color:var(--text3);margin-top:3px;}
.txn-chev{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  color:var(--text3);font-size:12px;transition:transform .2s;
  pointer-events:none;display:none;
}
.txn-grp.expandable .txn-chev{display:block;}
.txn-grp.expandable.open .txn-chev{transform:translateY(-50%) rotate(180deg);}

/* ── EXPAND PANEL ── */
.txn-expand{
  display:none;
  padding:0 0 12px 54px;
  animation:slideDown .15s ease;
}
.txn-grp.open .txn-expand{display:block;}
@keyframes slideDown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.expand-inner{
  background:var(--surface2);border-radius:12px;
  padding:11px 13px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
}
.expand-info{font-size:12px;color:var(--text2);line-height:1.8;flex:1;}
.expand-info strong{color:var(--text);font-weight:600;}
.btn-del-sm{
  background:var(--red-dim);color:var(--red);
  border:1px solid rgba(248,113,113,.2);
  padding:6px 12px;border-radius:8px;font-size:11px;
  font-weight:700;cursor:pointer;font-family:inherit;
  white-space:nowrap;flex-shrink:0;
  transition:background .15s;
}
.btn-del-sm:active{background:rgba(248,113,113,.25);}

/* ── DATE GROUP HEADER ── */
.dg-hdr{
  font-size:11px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.9px;
  padding:16px 0 8px;
}

/* ── CARDS FOR HISTORY ── */
.hist-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:0 14px;margin-bottom:8px;overflow:hidden;
}

/* ── TOGGLE BAR ── */
.toggle-bar{
  display:flex;background:var(--surface2);border-radius:var(--rs);
  padding:4px;margin-bottom:20px;border:1px solid var(--border);
}
.tgl-btn{
  flex:1;padding:10px;border-radius:9px;border:none;
  background:transparent;color:var(--text2);
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  transition:all .18s;
}
.tgl-btn.active{background:var(--accent);color:#070B17;}
.tgl-btn.active.income-t{background:var(--green);color:#070B17;}

/* ── CATEGORY GRID ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 18px;}
.cat-pill{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 4px 8px;border-radius:13px;border:1.5px solid var(--border);
  cursor:pointer;transition:all .15s;background:var(--surface2);
}
.cat-pill.sel{border-color:var(--accent);background:var(--accent-dim);}
.cat-pill-ico{font-size:21px;line-height:1;}
.cat-pill-lbl{font-size:8.5px;font-weight:700;text-align:center;color:var(--text2);line-height:1.25;word-break:break-word;}
.cat-pill.sel .cat-pill-lbl{color:var(--accent);}

/* ── INPUTS ── */
.inp-group{margin-bottom:14px;}
.inp-lbl{
  font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;display:block;
}
.inp{
  width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--rs);color:var(--text);font-family:inherit;
  font-size:15px;padding:12px 14px;outline:none;transition:border-color .15s,background .15s;
  appearance:none;-webkit-appearance:none;
}
.inp:focus{border-color:var(--accent);background:var(--surface3);}
.inp.inc:focus{border-color:var(--green);}
.inp-big{
  font-size:32px;font-weight:800;font-family:'Syne',sans-serif;
  text-align:center;padding:14px;letter-spacing:-1px;
}
.inp-prefix{position:relative;}
.inp-prefix::before{
  content:'₹';position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--text3);font-size:16px;font-weight:700;pointer-events:none;z-index:1;
}
.inp-prefix .inp{padding-left:28px;}

/* ── BUTTONS ── */
.btn{
  width:100%;border:none;border-radius:var(--rs);padding:15px;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  transition:opacity .12s,transform .1s;letter-spacing:.1px;
}
.btn:active{opacity:.82;transform:scale(.98);}
.btn-primary{background:var(--accent);color:#070B17;}
.btn-income{background:var(--green);color:#070B17;}
.btn-ghost{background:var(--surface2);color:var(--text);border:1.5px solid var(--border);}
.btn-danger{background:var(--red-dim);color:var(--red);border:1.5px solid rgba(248,113,113,.2);}

/* ── HISTORY FILTER CHIPS ── */
.hist-filter{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.hist-filter::-webkit-scrollbar{display:none;}
.hist-chip{
  flex-shrink:0;padding:7px 16px;border-radius:99px;font-size:12px;
  font-weight:700;cursor:pointer;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--text2);transition:all .15s;
  letter-spacing:.2px;
}
.hist-chip.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}

/* ── STAT ROWS ── */
.stat-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;font-size:14px;border-bottom:1px solid var(--border);
}
.stat-row:last-child{border-bottom:none;}
.stat-label{color:var(--text2);}
.stat-val{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;}

/* ── MONTH BREAKDOWN ITEM ── */
.month-item{padding:12px 0;border-bottom:1px solid var(--border);}
.month-item:last-child{border-bottom:none;}
.month-item-name{font-weight:700;font-size:14px;margin-bottom:5px;}
.month-item-row{display:flex;gap:12px;font-size:12px;}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:52px 20px;color:var(--text3);}
.empty-ico{font-size:44px;margin-bottom:12px;opacity:.6;}
.empty-txt{font-size:14px;line-height:1.6;}

/* ── TOAST ── */
#toast{
  position:fixed;
  bottom:calc(var(--nav) + var(--sb) + 56px);
  left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--surface3);color:var(--text);
  padding:9px 22px;border-radius:99px;font-size:13px;font-weight:600;
  border:1px solid var(--border2);opacity:0;transition:all .22s;
  z-index:1000;white-space:nowrap;pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── CUSTOM CATEGORY FORM ── */
.cc-form{
  display:flex;gap:8px;align-items:stretch;margin-top:12px;
}
.cc-ico-inp{
  width:52px;text-align:center;font-size:22px;padding:8px 4px;
  flex-shrink:0;
}
.cc-name-inp{flex:1;font-size:14px;}
.cc-add-btn{
  width:44px;flex-shrink:0;
  background:var(--accent);border:none;border-radius:var(--rs);
  color:#070B17;font-size:20px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .15s;
}
.cc-add-btn:active{opacity:.8;}
.cc-list{margin-bottom:10px;display:flex;flex-direction:column;gap:6px;}
.cc-item{
  display:flex;align-items:center;gap:10px;
  background:var(--surface2);border-radius:10px;
  padding:9px 12px;border:1px solid var(--border);
}
.cc-item-ico{font-size:18px;flex-shrink:0;}
.cc-item-lbl{flex:1;font-size:13px;font-weight:600;}
.cc-item-del{
  background:none;border:none;color:var(--text3);font-size:16px;
  cursor:pointer;padding:2px 4px;transition:color .15s;
}
.cc-item-del:active{color:var(--red);}

/* ── COLOR SWATCHES ── */
.swatch-row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 4px;}
.swatch{
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:transform .15s,border-color .15s;
  flex-shrink:0;
}
.swatch.picked{border-color:var(--text);transform:scale(1.2);}

/* ── BADGE ── */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;color:var(--text2);
}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--border);margin:12px 0;}
</style>
</head>
<body>
<div id="app">

  <!-- PAGE: DASHBOARD -->
  <div id="page-dashboard" class="page active">
    <div class="hdr">
      <div class="hdr-left">
        <div class="hdr-wordmark">Money<em>Wise</em></div>
        <div class="hdr-sub">Track every rupee</div>
      </div>
    </div>
    <div id="dash-body"></div>
  </div>

  <!-- PAGE: ADD -->
  <div id="page-add" class="page">
    <div class="hdr">
      <div class="hdr-wordmark">Add <em id="add-mode-lbl">Expense</em></div>
    </div>
    <div id="add-body"></div>
  </div>

  <!-- PAGE: HISTORY -->
  <div id="page-history" class="page">
    <div class="hdr">
      <div class="hdr-wordmark">History</div>
    </div>
    <div id="hist-body"></div>
  </div>

  <!-- PAGE: DATA -->
  <div id="page-data" class="page">
    <div class="hdr">
      <div class="hdr-wordmark">Data <em style="font-size:16px;color:var(--text2);font-weight:600">&amp; Export</em></div>
    </div>
    <div id="data-body"></div>
  </div>

  <!-- BOTTOM NAV (3 items + center gap for FAB) -->
  <nav class="nav">
    <button class="nav-item active" id="nav-dashboard" onclick="navigate('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" id="nav-history" onclick="navigate('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span class="nav-label">History</span>
    </button>
    <div class="nav-mid"></div>
    <button class="nav-item" id="nav-data" onclick="navigate('data')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span class="nav-label">Data</span>
    </button>
    <button class="nav-item" id="nav-settings" onclick="navigate('settings')" style="display:none"></button>
  </nav>

  <!-- FLOATING ACTION BUTTON -->
  <div class="fab-ring" id="fab-ring"></div>
  <button class="fab" id="fab-btn" onclick="fabTap()">
    <svg viewBox="0 0 24 24" fill="none" stroke="#070B17" stroke-width="2.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <div id="toast"></div>
</div>

<script>
// ═══════════════════════════════════════════
//   BUILT-IN CATEGORIES
// ═══════════════════════════════════════════
const BUILTIN = {
  food:          {label:'Food & Dining',    icon:'🍽️', color:'#FF8C42'},
  transport:     {label:'Transport',        icon:'🚇',  color:'#4A9EFF'},
  shopping:      {label:'Shopping',         icon:'🛒',  color:'#B47FFF'},
  bills:         {label:'Bills & Utilities',icon:'⚡',  color:'#FFD166'},
  entertainment: {label:'Entertainment',    icon:'🎭',  color:'#FF6B9D'},
  health:        {label:'Health',           icon:'💊',  color:'#2DD4BF'},
  education:     {label:'Education',        icon:'📚',  color:'#60A5FA'},
  housing:       {label:'Housing & Rent',   icon:'🏠',  color:'#6EE7B7'},
  travel:        {label:'Travel',           icon:'✈️',  color:'#FBA4C0'},
  other:         {label:'Other',            icon:'💸',  color:'#94A3B8'},
};
const SWATCH_COLORS=['#FF8C42','#F5A623','#FFD166','#34D399','#2DD4BF','#60A5FA','#4A9EFF','#B47FFF','#FF6B9D','#FBA4C0','#F87171','#94A3B8'];

let CATS = {...BUILTIN};
let CAT_KEYS = Object.keys(CATS);
let selSwatchColor = SWATCH_COLORS[5];

// ═══════════════════════════════════════════
//   STATE
// ═══════════════════════════════════════════
let D        = {expenses:[], revenue:[]};
let curPage  = 'dashboard';
let addMode  = 'expense';
let selCat   = 'food';
let curMonth = todayStr().slice(0,7);
let histFilt = 'all';

// ═══════════════════════════════════════════
//   STORAGE
// ═══════════════════════════════════════════
function loadData(){
  try{
    const s=localStorage.getItem('MoneyWise_v2');
    if(s) D=JSON.parse(s);
  }catch(e){}
}
function saveData(){
  localStorage.setItem('MoneyWise_v2',JSON.stringify(D));
}
function loadCustomCats(){
  try{
    const s=localStorage.getItem('moneywise_cats');
    if(s){
      JSON.parse(s).forEach(c=>{
        CATS[c.key]={label:c.label,icon:c.icon,color:c.color,custom:true};
      });
      CAT_KEYS=Object.keys(CATS);
    }
  }catch(e){}
}
function saveCustomCats(){
  const arr=Object.entries(CATS)
    .filter(([,v])=>v.custom)
    .map(([k,v])=>({key:k,label:v.label,icon:v.icon,color:v.color}));
  localStorage.setItem('moneywise_cats',JSON.stringify(arr));
}

// ═══════════════════════════════════════════
//   HELPERS
// ═══════════════════════════════════════════
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function pad(n){ return String(n).padStart(2,'0'); }
function fmtCur(n){
  return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtDate(s){
  return new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function monthLabel(mk){
  const [y,m]=mk.split('-');
  return new Date(y,m-1).toLocaleString('en-IN',{month:'long',year:'numeric'});
}
function dateGroupLabel(s){
  const d=new Date(s+'T00:00:00');
  const t=new Date(); t.setHours(0,0,0,0);
  const y=new Date(t); y.setDate(y.getDate()-1);
  if(d.getTime()===t.getTime()) return 'Today';
  if(d.getTime()===y.getTime()) return 'Yesterday';
  return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function monthData(mk){
  return {
    expenses:D.expenses.filter(e=>e.date.startsWith(mk)),
    revenue: D.revenue.filter(r=>r.date.startsWith(mk)),
  };
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════
//   NAVIGATION
// ═══════════════════════════════════════════
function navigate(page){
  document.getElementById('page-'+curPage)?.classList.remove('active');
  ['dashboard','history','data'].forEach(p=>{
    document.getElementById('nav-'+p)?.classList.remove('active');
  });

  curPage=page;

  document.getElementById('page-'+page)?.classList.add('active');
  if(page!=='add') document.getElementById('nav-'+page)?.classList.add('active');

  // FAB state
  const fab=document.getElementById('fab-btn');
  if(page==='add') fab.classList.add('on-add-page');
  else fab.classList.remove('on-add-page');

  renderPage(page);
}

function fabTap(){
  if(curPage==='add') navigate('dashboard');
  else navigate('add');
}

function renderPage(p){
  if(p==='dashboard') renderDash();
  else if(p==='add')  renderAdd();
  else if(p==='history') renderHistory();
  else if(p==='data') renderData();
}

// ═══════════════════════════════════════════
//   DASHBOARD
// ═══════════════════════════════════════════
function renderDash(){
  const {expenses,revenue}=monthData(curMonth);
  const totExp=expenses.reduce((s,e)=>s+e.amount,0);
  const totRev=revenue.reduce((s,r)=>s+r.amount,0);
  const net=totRev-totExp;

  const byCat={};
  expenses.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+e.amount; });
  const catArr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxAmt=catArr[0]?.[1]||1;

  const recent=[
    ...expenses.map(e=>({...e,_t:'exp'})),
    ...revenue.map(r=>({...r,_t:'rev'})),
  ].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,5);

  const nc=net>=0?'var(--green)':'var(--red)';

  document.getElementById('dash-body').innerHTML=`
    <div class="month-nav">
      <button class="month-btn" onclick="chMonth(-1)">‹</button>
      <div class="month-lbl">${monthLabel(curMonth)}</div>
      <button class="month-btn" onclick="chMonth(1)">›</button>
    </div>

    <div class="hero">
      <div class="hero-lbl">Net Balance</div>
      <div class="hero-amt" style="color:${nc}">${fmtCur(net)}</div>
      <div class="hero-row">
        <div class="hero-stat">
          <div class="hero-stat-lbl" style="color:var(--green)">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 8V2M2 5l3-3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Income
          </div>
          <div class="hero-stat-amt" style="color:var(--green)">${fmtCur(totRev)}</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-lbl" style="color:var(--red)">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 2v6M2 5l3 3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Spent
          </div>
          <div class="hero-stat-amt" style="color:var(--red)">${fmtCur(totExp)}</div>
        </div>
      </div>
    </div>

    ${catArr.length?`
    <div class="card">
      <div class="section-title">By Category</div>
      ${catArr.map(([cat,amt])=>{
        const c=CATS[cat]||CATS.other;
        const pct=totExp?Math.round(amt/totExp*100):0;
        return `<div class="cat-bar">
          <div class="cat-bar-top">
            <span class="cat-bar-name">
              <span class="cat-bar-ico">${c.icon}</span>${esc(c.label)}
            </span>
            <span class="cat-bar-right">
              <span class="cat-bar-val">${fmtCur(amt)}</span>
              <span class="cat-bar-pct">${pct}%</span>
            </span>
          </div>
          <div class="cat-track">
            <div class="cat-fill" style="width:${(amt/maxAmt*100).toFixed(1)}%;background:${c.color}"></div>
          </div>
        </div>`;
      }).join('')}
    </div>`:''
    }

    <div class="section-title" style="margin-top:4px">Recent</div>
    ${recent.length===0
      ?`<div class="empty"><div class="empty-ico">💸</div><div class="empty-txt">Nothing this month yet.<br>Tap <strong>+</strong> to add your first entry.</div></div>`
      :`<div class="hist-card">${recent.map(t=>txnRow(t,false)).join('')}</div>`
    }
  `;
}

function chMonth(d){
  const [y,m]=curMonth.split('-').map(Number);
  const nd=new Date(y,m-1+d);
  curMonth=nd.getFullYear()+'-'+pad(nd.getMonth()+1);
  renderDash();
}

// ═══════════════════════════════════════════
//   ADD PAGE
// ═══════════════════════════════════════════
function renderAdd(){
  const lbl=document.getElementById('add-mode-lbl');
  if(lbl) lbl.textContent=addMode==='expense'?'Expense':'Income';

  document.getElementById('add-body').innerHTML=`
    <div class="toggle-bar">
      <button class="tgl-btn ${addMode==='expense'?'active':''}" onclick="setMode('expense')">🔴 &nbsp;Expense</button>
      <button class="tgl-btn ${addMode==='revenue'?'active income-t':''}" onclick="setMode('revenue')">🟢 &nbsp;Income</button>
    </div>
    ${addMode==='expense'?expForm():revForm()}
  `;
}

function expForm(){
  return `
    <div class="inp-group">
      <label class="inp-lbl">Category</label>
      <div class="cat-grid">
        ${CAT_KEYS.map(k=>`
          <div class="cat-pill ${selCat===k?'sel':''}" onclick="selCategory('${k}')">
            <span class="cat-pill-ico">${CATS[k].icon}</span>
            <span class="cat-pill-lbl">${esc(CATS[k].label)}</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="inp-group">
      <label class="inp-lbl">Detail / Description</label>
      <input class="inp" id="e-detail" placeholder="e.g. McDonald's, Ola, Zara…" autocomplete="off" autocorrect="off">
    </div>
    <div class="inp-group">
      <label class="inp-lbl">Date</label>
      <input class="inp" id="e-date" type="date" value="${todayStr()}">
    </div>
    <div class="inp-group">
      <label class="inp-lbl">Amount (₹)</label>
      <div class="inp-prefix">
        <input class="inp inp-big" id="e-amount" type="number" inputmode="decimal" placeholder="0" min="0" step="any">
      </div>
    </div>
    <button class="btn btn-primary" onclick="submitExp()">Save Expense</button>
  `;
}

function revForm(){
  return `
    <div class="inp-group">
      <label class="inp-lbl">Source</label>
      <input class="inp inc" id="r-source" placeholder="e.g. Salary, Freelance, Gift…" autocomplete="off">
    </div>
    <div class="inp-group">
      <label class="inp-lbl">Detail / Description</label>
      <input class="inp inc" id="r-detail" placeholder="e.g. May 2026 salary…" autocomplete="off">
    </div>
    <div class="inp-group">
      <label class="inp-lbl">Date</label>
      <input class="inp inc" id="r-date" type="date" value="${todayStr()}">
    </div>
    <div class="inp-group">
      <label class="inp-lbl">Amount (₹)</label>
      <div class="inp-prefix">
        <input class="inp inp-big inc" id="r-amount" type="number" inputmode="decimal" placeholder="0" min="0" step="any">
      </div>
    </div>
    <button class="btn btn-income" onclick="submitRev()">Save Income</button>
  `;
}

function setMode(m){
  addMode=m;
  renderAdd();
}
function selCategory(k){
  selCat=k;
  // update pills without full re-render
  document.querySelectorAll('.cat-pill').forEach(el=>{
    el.classList.toggle('sel', el.getAttribute('onclick').includes(`'${k}'`));
    el.querySelector('.cat-pill-lbl')?.classList.toggle('sel',false);
  });
  // simpler: just re-render
  renderAdd();
}

function submitExp(){
  const detail=document.getElementById('e-detail').value.trim();
  const date=document.getElementById('e-date').value;
  const amt=parseFloat(document.getElementById('e-amount').value);
  if(!date){ toast('Pick a date'); return; }
  if(!amt||amt<=0){ toast('Enter an amount'); return; }
  D.expenses.push({id:uid(),category:selCat,detail,date,amount:amt});
  saveData();
  toast('Expense saved ✓');
  navigate('dashboard');
}
function submitRev(){
  const source=document.getElementById('r-source').value.trim();
  const detail=document.getElementById('r-detail').value.trim();
  const date=document.getElementById('r-date').value;
  const amt=parseFloat(document.getElementById('r-amount').value);
  if(!source){ toast('Enter a source'); return; }
  if(!date){ toast('Pick a date'); return; }
  if(!amt||amt<=0){ toast('Enter an amount'); return; }
  D.revenue.push({id:uid(),source,detail,date,amount:amt});
  saveData();
  toast('Income saved ✓');
  navigate('dashboard');
}

// ═══════════════════════════════════════════
//   HISTORY
// ═══════════════════════════════════════════
function renderHistory(){
  let items=[];
  if(histFilt!=='revenue') items.push(...D.expenses.map(e=>({...e,_t:'exp'})));
  if(histFilt!=='expense') items.push(...D.revenue.map(r=>({...r,_t:'rev'})));
  items.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));

  const byDate={};
  items.forEach(it=>{ (byDate[it.date]=byDate[it.date]||[]).push(it); });
  const dates=Object.keys(byDate).sort().reverse();

  document.getElementById('hist-body').innerHTML=`
    <div class="hist-filter">
      <div class="hist-chip ${histFilt==='all'?'active':''}" onclick="setFilt('all')">All</div>
      <div class="hist-chip ${histFilt==='expense'?'active':''}" onclick="setFilt('expense')">Expenses</div>
      <div class="hist-chip ${histFilt==='revenue'?'active':''}" onclick="setFilt('revenue')">Income</div>
    </div>
    ${dates.length===0
      ?`<div class="empty"><div class="empty-ico">📋</div><div class="empty-txt">Nothing here yet.</div></div>`
      :dates.map(dt=>`
        <div class="dg-hdr">${dateGroupLabel(dt)}</div>
        <div class="hist-card">
          ${byDate[dt].map(t=>txnRow(t,true)).join('')}
        </div>`).join('')
    }
  `;
}
function setFilt(f){ histFilt=f; renderHistory(); }

// ═══════════════════════════════════════════
//   TRANSACTION ROW (shared)
// ═══════════════════════════════════════════
function txnRow(t, expandable){
  const isExp=t._t==='exp';
  const cat=isExp?(CATS[t.category]||CATS.other):null;
  const ico=isExp?cat.icon:'💰';
  const col=isExp?cat.color:'var(--green)';
  const name=isExp?cat.label:(t.source||'Income');
  const sub=t.detail||'';
  const sign=isExp?'−':'+';
  const amtC=isExp?'var(--red)':'var(--green)';
  const id=t.id;

  if(!expandable){
    return `<div class="txn-grp">
      <div class="txn-item" style="cursor:default">
        <div class="txn-ico" style="background:${col}1A">${ico}</div>
        <div class="txn-body">
          <div class="txn-name">${esc(name)}</div>
          ${sub?`<div class="txn-sub">${esc(sub)}</div>`:''}
        </div>
        <div class="txn-right">
          <div class="txn-amt" style="color:${amtC}">${sign}${fmtCur(t.amount)}</div>
          <div class="txn-date">${fmtDate(t.date)}</div>
        </div>
      </div>
    </div>`;
  }

  return `<div class="txn-grp expandable" id="grp-${id}">
    <div class="txn-item" onclick="toggleExpand('${id}')">
      <div class="txn-ico" style="background:${col}1A">${ico}</div>
      <div class="txn-body">
        <div class="txn-name">${esc(name)}</div>
        ${sub?`<div class="txn-sub">${esc(sub)}</div>`:''}
      </div>
      <div class="txn-right" style="padding-right:18px">
        <div class="txn-amt" style="color:${amtC}">${sign}${fmtCur(t.amount)}</div>
        <div class="txn-date">${fmtDate(t.date)}</div>
      </div>
      <span class="txn-chev">▾</span>
    </div>
    <div class="txn-expand">
      <div class="expand-inner">
        <div class="expand-info">
          ${sub?`<div><strong>Detail:</strong> ${esc(sub)}</div>`:''}
          ${isExp
            ?`<div><strong>Category:</strong> ${esc(cat.label)}</div>`
            :`<div><strong>Source:</strong> ${esc(t.source||'')}</div>`
          }
          <div><strong>Date:</strong> ${fmtDate(t.date)}</div>
          <div><strong>Amount:</strong> <span style="color:${amtC}">${sign}${fmtCur(t.amount)}</span></div>
        </div>
        <button class="btn-del-sm" onclick="event.stopPropagation();delEntry('${id}','${t._t}')">Delete</button>
      </div>
    </div>
  </div>`;
}

function toggleExpand(id){
  const grp=document.getElementById('grp-'+id);
  if(grp) grp.classList.toggle('open');
}
function delEntry(id,type){
  if(!confirm('Delete this entry?')) return;
  if(type==='exp') D.expenses=D.expenses.filter(e=>e.id!==id);
  else D.revenue=D.revenue.filter(r=>r.id!==id);
  saveData();
  renderHistory();
  toast('Deleted');
}

// ═══════════════════════════════════════════
//   DATA PAGE
// ═══════════════════════════════════════════
function renderData(){
  const totE=D.expenses.reduce((s,e)=>s+e.amount,0);
  const totR=D.revenue.reduce((s,r)=>s+r.amount,0);
  const net=totR-totE;

  const months=new Set([
    ...D.expenses.map(e=>e.date.slice(0,7)),
    ...D.revenue.map(r=>r.date.slice(0,7)),
  ]);
  const mArr=[...months].sort().reverse().slice(0,6);

  const customCats=Object.entries(CATS).filter(([,v])=>v.custom);

  document.getElementById('data-body').innerHTML=`

    <!-- ALL-TIME SUMMARY -->
    <div class="card">
      <div class="section-title">All-Time</div>
      <div class="stat-row">
        <span class="stat-label">Total Income</span>
        <span class="stat-val" style="color:var(--green)">${fmtCur(totR)}</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Total Expenses</span>
        <span class="stat-val" style="color:var(--red)">${fmtCur(totE)}</span>
      </div>
      <div class="stat-row">
        <span class="stat-label" style="font-weight:700;color:var(--text)">Net Balance</span>
        <span class="stat-val" style="color:${net>=0?'var(--green)':'var(--red)'}">${fmtCur(net)}</span>
      </div>
    </div>

    <!-- MONTHLY BREAKDOWN -->
    ${mArr.length?`
    <div class="card">
      <div class="section-title">Monthly</div>
      ${mArr.map(mk=>{
        const {expenses:me,revenue:mr}=monthData(mk);
        const et=me.reduce((s,e)=>s+e.amount,0);
        const rt=mr.reduce((s,r)=>s+r.amount,0);
        const n=rt-et;
        return `<div class="month-item">
          <div class="month-item-name">${monthLabel(mk)}</div>
          <div class="month-item-row">
            <span style="color:var(--green)">+${fmtCur(rt)}</span>
            <span style="color:var(--red)">−${fmtCur(et)}</span>
            <span style="color:${n>=0?'var(--green)':'var(--red)'}">= ${fmtCur(n)}</span>
          </div>
        </div>`;
      }).join('')}
    </div>`:''
    }

    <!-- CUSTOM CATEGORIES -->
    <div class="card">
      <div class="section-title">Categories</div>
      <div style="color:var(--text2);font-size:12px;margin-bottom:12px;">Add your own types — they show up everywhere.</div>

      ${customCats.length?`
      <div class="cc-list">
        ${customCats.map(([k,v])=>`
          <div class="cc-item">
            <span class="cc-item-ico">${v.icon}</span>
            <span class="cc-item-lbl" style="color:${v.color}">${esc(v.label)}</span>
            <button class="cc-item-del" onclick="delCustomCat('${k}')" title="Delete">✕</button>
          </div>`).join('')}
      </div>`:''}

      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;">New Category</div>
      <div class="cc-form">
        <input class="inp cc-ico-inp" id="cc-icon" maxlength="4" placeholder="🏷️">
        <input class="inp cc-name-inp" id="cc-name" placeholder="e.g. Family, Pets, Gym…" autocomplete="off">
        <button class="cc-add-btn" onclick="addCustomCat()">+</button>
      </div>
      <div style="margin-top:8px;">
        <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;">Pick a colour</div>
        <div class="swatch-row" id="swatch-row">
          ${SWATCH_COLORS.map(c=>`
            <div class="swatch ${c===selSwatchColor?'picked':''}"
              style="background:${c}"
              onclick="pickSwatch('${c}')"></div>`).join('')}
        </div>
      </div>
    </div>

    <!-- EXPORT -->
    <div class="card">
      <div class="section-title">Export</div>
      <div style="color:var(--text2);font-size:13px;margin-bottom:14px;line-height:1.6;">
        One Excel file — each month is its own sheet, expenses grouped by category with subtotals and totals.
      </div>
      <button class="btn btn-primary" onclick="exportExcel()">📥 &nbsp;Export to Excel</button>
    </div>

    <!-- IMPORT -->
    <div class="card">
      <div class="section-title">Import</div>
      <div style="color:var(--text2);font-size:13px;margin-bottom:14px;line-height:1.6;">
        Restore from a previously exported file. Duplicates are skipped.
      </div>
      <input type="file" id="imp-file" accept=".xlsx,.xls" style="display:none" onchange="handleImport(this)">
      <button class="btn btn-ghost" onclick="document.getElementById('imp-file').click()">📤 &nbsp;Import Excel File</button>
    </div>

    <!-- DANGER -->
    <div class="card" style="border-color:rgba(248,113,113,.18);margin-bottom:16px;">
      <div class="section-title" style="color:var(--red)">Danger Zone</div>
      <div style="color:var(--text2);font-size:13px;margin-bottom:14px;">Remove all data from this device. Cannot be undone.</div>
      <button class="btn btn-danger" onclick="clearAll()">🗑️ &nbsp;Clear All Data</button>
    </div>

    <div style="text-align:center;color:var(--text3);font-size:11px;padding:4px 0 8px;">
      ${D.expenses.length} expenses · ${D.revenue.length} income entries
    </div>
  `;
}

//   CUSTOM CATEGORIES
// ═══════════════════════════════════════════
function pickSwatch(c){
  selSwatchColor=c;
  document.querySelectorAll('.swatch').forEach(el=>{
    el.classList.toggle('picked',el.style.background===c);
  });
}

function addCustomCat(){
  const ico=(document.getElementById('cc-icon').value.trim()||'🏷️');
  const name=document.getElementById('cc-name').value.trim();
  if(!name){ toast('Enter a category name'); return; }

  // unique key
  const key='custom_'+uid();
  CATS[key]={label:name,icon:ico,color:selSwatchColor,custom:true};
  CAT_KEYS=Object.keys(CATS);
  saveCustomCats();
  toast(`"${name}" added`);
  renderData();
}

function delCustomCat(key){
  if(!confirm(`Delete "${CATS[key]?.label}"?`)) return;
  delete CATS[key];
  CAT_KEYS=Object.keys(CATS);
  saveCustomCats();
  if(selCat===key) selCat='other';
  toast('Category deleted');
  renderData();
}

// ═══════════════════════════════════════════
//   EXPORT
// ═══════════════════════════════════════════
function exportExcel(){
  if(!window.XLSX){ toast('XLSX library not loaded'); return; }

  const wb=XLSX.utils.book_new();
  const allMonths=new Set([
    ...D.expenses.map(e=>e.date.slice(0,7)),
    ...D.revenue.map(r=>r.date.slice(0,7)),
  ]);
  if(!allMonths.size){ toast('No data to export'); return; }

  [...allMonths].sort().forEach(mk=>{
    const {expenses,revenue}=monthData(mk);
    const rows=[];

    rows.push(['EXPENSES','','','']);
    rows.push(['Type','Detail','Date','Amount (₹)']);

    const byCat={};
    expenses.forEach(e=>{ (byCat[e.category]=byCat[e.category]||[]).push(e); });

    let totE=0;
    Object.entries(byCat).sort().forEach(([cat,items])=>{
      const lbl=CATS[cat]?.label||cat;
      items.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
        rows.push([lbl, e.detail||'', fmtDate(e.date), e.amount]);
      });
      const sub=items.reduce((s,e)=>s+e.amount,0);
      totE+=sub;
      rows.push([lbl+' Total','','',sub]);
      rows.push(['','','','']);
    });

    rows.push(['MONTHLY EXPENSES TOTAL','','',totE]);
    rows.push(['','','','']);
    rows.push(['','','','']);

    rows.push(['REVENUE','','','']);
    rows.push(['Source','Detail','Date','Amount (₹)']);

    let totR=0;
    revenue.sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
      rows.push([r.source||'', r.detail||'', fmtDate(r.date), r.amount]);
      totR+=r.amount;
    });

    rows.push(['REVENUE TOTAL','','',totR]);
    rows.push(['','','','']);
    rows.push(['NET BALANCE (Revenue − Expenses)','','',totR-totE]);

    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:28},{wch:36},{wch:16},{wch:16}];

    const [y,m]=mk.split('-');
    const sname=new Date(+y,m-1).toLocaleString('en',{month:'short'})+' '+y;
    XLSX.utils.book_append_sheet(wb,ws,sname);
  });

  XLSX.writeFile(wb,'MoneyWise_expenses.xlsx');
  toast('Exported ✓');
}

// ═══════════════════════════════════════════
//   IMPORT
// ═══════════════════════════════════════════
function handleImport(inp){
  if(!inp.files[0]) return;
  const file=inp.files[0];
  inp.value='';
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',raw:true});
      let addedE=0, addedR=0;

      wb.SheetNames.forEach(sname=>{
        const ws=wb.Sheets[sname];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
        let inRev=false;

        rows.forEach(row=>{
          const c0=String(row[0]||'').trim();
          const c1=String(row[1]||'').trim();
          const c2=String(row[2]||'').trim();
          const c3=row[3];
          const amt=typeof c3==='number'?c3:parseFloat(c3);

          if(!c0) return;
          if(c0==='EXPENSES'||c0==='Type'||c0==='Source'||c0==='Detail') return;
          if(c0==='REVENUE'){ inRev=true; return; }
          if(c0.endsWith(' Total')||c0==='MONTHLY EXPENSES TOTAL'||
             c0==='REVENUE TOTAL'||c0.startsWith('NET BALANCE')) return;
          if(isNaN(amt)||amt<=0) return;

          const date=parseImportDate(c2)||todayStr();

          if(inRev){
            const dup=D.revenue.some(r=>r.source===c0&&r.detail===c1&&r.date===date&&r.amount===amt);
            if(!dup){ D.revenue.push({id:uid(),source:c0,detail:c1,date,amount:amt}); addedR++; }
          } else {
            let catKey='other';
            for(const [k,v] of Object.entries(CATS)){
              if(v.label===c0||k===c0.toLowerCase()){ catKey=k; break; }
            }
            const dup=D.expenses.some(e=>e.category===catKey&&e.detail===c1&&e.date===date&&e.amount===amt);
            if(!dup){ D.expenses.push({id:uid(),category:catKey,detail:c1,date,amount:amt}); addedE++; }
          }
        });
      });

      saveData();
      toast(`Imported ${addedE} expenses, ${addedR} income`);
      renderPage(curPage);
    }catch(err){
      toast('Import failed — check file format');
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseImportDate(str){
  if(!str) return null;
  str=String(str).trim();
  if(!str) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;

  const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const m=str.match(/(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})/);
  if(m){
    const mi=MONTHS.findIndex(mo=>m[2].toLowerCase().startsWith(mo));
    if(mi!==-1) return `${m[3]}-${pad(mi+1)}-${pad(m[1])}`;
  }

  const serial=Number(str);
  if(!isNaN(serial)&&serial>30000){
    const d=new Date(Math.round((serial-25569)*86400*1000));
    return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
  }

  const d=new Date(str);
  if(!isNaN(d.getTime())) return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  return null;
}

// ═══════════════════════════════════════════
//   MISC

function clearAll(){
  if(!confirm('Delete ALL data permanently? This cannot be undone.')) return;
  D={expenses:[],revenue:[]};
  saveData();
  toast('All data cleared');
  renderPage(curPage);
}

let _tTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(_tTimer);
  _tTimer=setTimeout(()=>el.classList.remove('show'),2600);
}
