<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070B17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MoneyWise">
<title>MoneyWise</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"MoneyWise","short_name":"MoneyWise","start_url":".","display":"standalone","background_color":"%23070B17","theme_color":"%23070B17","orientation":"portrait","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27 viewBox%3D%270 0 512 512%27%3E%3Crect width%3D%27512%27 height%3D%27512%27 rx%3D%27110%27 fill%3D%27%23070B17%27%2F%3E%3Ctext x%3D%27256%27 y%3D%27345%27 text-anchor%3D%27middle%27 font-size%3D%27280%27%3E%F0%9F%92%B8%3C%2Ftext%3E%3C%2Fsvg%3E","sizes":"512x512","type":"image/svg+xml"}]}'>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27 viewBox%3D%270 0 512 512%27%3E%3Crect width%3D%27512%27 height%3D%27512%27 rx%3D%27110%27 fill%3D%27%23070B17%27%2F%3E%3Ctext x%3D%27256%27 y%3D%27345%27 text-anchor%3D%27middle%27 font-size%3D%27280%27%3E%F0%9F%92%B8%3C%2Ftext%3E%3C%2Fsvg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ── RESET & BASE ─────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070B17;--bg2:#0E1525;--bg3:#141D30;--bg4:#1A2438;
  --text:#F0F4FF;--text2:#8899BB;--text3:#4A5A78;
  --accent:#4A9EFF;--accent2:#7C5DFF;
  --green:#34D399;--red:#F87171;
  --card-border:rgba(255,255,255,.06);
  --radius:16px;--radius-sm:10px;
  --nav-h:64px;--hdr-h:60px;
  --font-head:'Syne',sans-serif;--font-body:'Plus Jakarta Sans',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input{font-family:inherit;color:var(--text);outline:none;border:none}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.5)}

/* ── APP SHELL ─────────────────────────── */
#app{display:flex;flex-direction:column;height:100%;position:relative}
.page{display:none;flex-direction:column;flex:1;overflow-y:auto;padding:0 0 calc(var(--nav-h) + 24px);-webkit-overflow-scrolling:touch}
.page.active{display:flex}

/* ── HEADER ─────────────────────────── */
.hdr{padding:16px 20px 10px;flex-shrink:0}
.hdr-left{}
.hdr-wordmark{font-family:var(--font-head);font-size:26px;font-weight:800;color:var(--text);line-height:1}
.hdr-wordmark em{font-style:normal;color:var(--accent)}
.hdr-sub{font-size:12px;color:var(--text3);margin-top:2px;font-weight:500;letter-spacing:.3px}

/* ── BOTTOM NAV ─────────────────────────── */
.nav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  display:flex;align-items:center;
  background:rgba(7,11,23,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--card-border);
  padding:0 8px;padding-bottom:env(safe-area-inset-bottom);
  z-index:100;gap:0;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;color:var(--text3);padding:6px 0;
  font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
  transition:color .2s;
}
.nav-item svg{width:20px;height:20px;stroke-width:1.8;transition:stroke .2s}
.nav-item.active{color:var(--accent)}
.nav-item.active svg{stroke:var(--accent)}
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:.5px}
.nav-mid{width:72px;flex-shrink:0}

/* ── FAB ─────────────────────────── */
.fab{
  position:fixed;bottom:calc(var(--nav-h) - 24px);left:50%;transform:translateX(-50%);
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(74,158,255,.4);
  z-index:101;transition:transform .2s,box-shadow .2s;
}
.fab:active{transform:translateX(-50%) scale(.92)}
.fab.on-add-page{background:linear-gradient(135deg,#F87171,#FF6B9D)}
.fab-ring{
  position:fixed;bottom:calc(var(--nav-h) - 30px);left:50%;transform:translateX(-50%);
  width:68px;height:68px;border-radius:50%;
  background:var(--bg);z-index:99;
}

/* ── CARDS ─────────────────────────── */
.card{
  margin:0 16px 14px;padding:16px;
  background:var(--bg2);border:1px solid var(--card-border);
  border-radius:var(--radius);
}
.section-title{
  font-family:var(--font-head);font-size:13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;color:var(--text3);
  margin-bottom:12px;
}

/* ── INPUTS ─────────────────────────── */
.inp{
  width:100%;background:var(--bg3);border:1.5px solid var(--card-border);
  border-radius:var(--radius-sm);padding:12px 14px;font-size:15px;
  color:var(--text);transition:border-color .2s;
}
.inp:focus{border-color:var(--accent)}
.inp.inc:focus{border-color:var(--green)}
.inp-big{font-size:24px;font-weight:700;padding:14px 14px 14px 34px}
.inp-group{margin:0 16px 14px}
.inp-lbl{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.inp-prefix{position:relative}
.inp-prefix::before{content:'₹';position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:17px;font-weight:700;pointer-events:none}

/* ── BUTTONS ─────────────────────────── */
.btn{
  display:block;width:calc(100% - 32px);margin:4px 16px;
  padding:15px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;
  letter-spacing:.3px;transition:opacity .2s,transform .15s;
}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-income{background:linear-gradient(135deg,#34D399,#059669);color:#fff}
.btn-ghost{background:var(--bg3);color:var(--text);border:1.5px solid var(--card-border)}
.btn-danger{background:rgba(248,113,113,.12);color:var(--red);border:1.5px solid rgba(248,113,113,.25)}

/* ── TOGGLE BAR ─────────────────────────── */
.toggle-bar{display:flex;gap:8px;margin:0 16px 16px;background:var(--bg2);border-radius:var(--radius-sm);padding:5px;border:1px solid var(--card-border)}
.tgl-btn{flex:1;padding:9px;border-radius:7px;background:none;color:var(--text3);font-size:13px;font-weight:700;transition:all .2s}
.tgl-btn.active{background:var(--bg4);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* ── CATEGORY GRID ─────────────────────────── */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cat-pill{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:var(--bg3);border:1.5px solid var(--card-border);
  border-radius:var(--radius-sm);cursor:pointer;transition:all .18s;
}
.cat-pill.sel{background:rgba(74,158,255,.12);border-color:var(--accent)}
.cat-pill-ico{font-size:18px;line-height:1}
.cat-pill-lbl{font-size:12px;font-weight:600;color:var(--text2);line-height:1.2}
.cat-pill.sel .cat-pill-lbl{color:var(--text)}

/* ── HERO ─────────────────────────── */
.hero{
  margin:6px 16px 16px;padding:20px;
  background:linear-gradient(135deg,rgba(74,158,255,.12),rgba(124,93,255,.08));
  border:1px solid rgba(74,158,255,.18);border-radius:var(--radius);
}
.hero-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:4px}
.hero-amt{font-family:var(--font-head);font-size:36px;font-weight:800;line-height:1;margin-bottom:12px}
.hero-row{display:flex;gap:16px}
.hero-stat{flex:1;background:rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:10px 12px}
.hero-stat-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:4px;margin-bottom:3px}
.hero-stat-amt{font-family:var(--font-head);font-size:17px;font-weight:700}

/* ── MONTH NAV ─────────────────────────── */
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:8px}
.month-btn{background:var(--bg2);border:1px solid var(--card-border);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;line-height:1}
.month-lbl{font-family:var(--font-head);font-size:16px;font-weight:700;color:var(--text)}

/* ── CATEGORY BAR ─────────────────────────── */
.cat-bar{margin-bottom:12px}
.cat-bar:last-child{margin-bottom:0}
.cat-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.cat-bar-name{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text)}
.cat-bar-ico{font-size:14px}
.cat-bar-right{display:flex;align-items:center;gap:8px}
.cat-bar-val{font-size:13px;font-weight:700;color:var(--text);font-family:var(--font-head)}
.cat-bar-pct{font-size:11px;color:var(--text3);background:var(--bg3);padding:2px 6px;border-radius:20px}
.cat-track{height:5px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.cat-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── HISTORY / TRANSACTIONS ─────────────────────────── */
.hist-filter{display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.hist-filter::-webkit-scrollbar{display:none}
.hist-chip{
  flex-shrink:0;padding:7px 14px;border-radius:99px;
  background:var(--bg2);border:1.5px solid var(--card-border);
  font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;transition:all .18s;
}
.hist-chip.active{background:rgba(74,158,255,.15);border-color:var(--accent);color:var(--accent)}

.dg-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);padding:4px 20px 6px}
.hist-card{margin:0 16px 14px;background:var(--bg2);border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden}

.txn-grp{border-bottom:1px solid var(--card-border)}
.txn-grp:last-child{border-bottom:none}
.txn-item{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;position:relative;transition:background .15s}
.txn-item:active{background:rgba(255,255,255,.03)}
.txn-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.txn-body{flex:1;min-width:0}
.txn-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-sub{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.txn-right{text-align:right;flex-shrink:0}
.txn-amt{font-family:var(--font-head);font-size:14px;font-weight:700}
.txn-date{font-size:11px;color:var(--text3);margin-top:2px}
.txn-chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:12px;transition:transform .2s}
.txn-grp.open .txn-chev{transform:translateY(-50%) rotate(180deg)}

.txn-expand{display:none}
.txn-grp.open .txn-expand{display:block}
.expand-inner{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.expand-info{font-size:13px;color:var(--text2);line-height:1.8;background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px}
.expand-info strong{color:var(--text)}
.btn-del-sm{align-self:flex-start;background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.2);padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;transition:all .18s}
.btn-del-sm:active{opacity:.7}

/* ── SUMMARY PAGE ─────────────────────────── */
.summ-period-bar{
  display:flex;gap:6px;padding:0 16px 14px;
}
.summ-period-btn{
  flex:1;padding:9px 6px;border-radius:var(--radius-sm);
  background:var(--bg2);border:1.5px solid var(--card-border);
  font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;
  transition:all .18s;text-align:center;
}
.summ-period-btn.active{
  background:rgba(74,158,255,.15);border-color:var(--accent);color:var(--accent);
}

.summ-nav{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px}
.summ-nav-btn{
  background:var(--bg2);border:1px solid var(--card-border);color:var(--text);
  width:34px;height:34px;border-radius:50%;font-size:18px;
  display:flex;align-items:center;justify-content:center;
}
.summ-nav-lbl{font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--text);flex:1;text-align:center}

.summ-hero{
  margin:0 16px 14px;padding:18px;
  background:linear-gradient(135deg,rgba(74,158,255,.10),rgba(124,93,255,.07));
  border:1px solid rgba(74,158,255,.15);border-radius:var(--radius);
}
.summ-hero-row{display:flex;gap:10px;margin-top:12px}
.summ-stat{flex:1;background:rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:10px}
.summ-stat-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:3px}
.summ-stat-val{font-family:var(--font-head);font-size:16px;font-weight:700}

.summ-cat-section{margin:0 16px 14px}
.summ-cat-hdr{
  font-family:var(--font-head);font-size:13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;color:var(--text3);
  margin-bottom:10px;
}
.summ-cat-card{
  background:var(--bg2);border:1px solid var(--card-border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:10px;
}
.summ-cat-row{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  cursor:pointer;transition:background .15s;
}
.summ-cat-row:active{background:rgba(255,255,255,.03)}
.summ-cat-ico-wrap{
  width:36px;height:36px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
}
.summ-cat-info{flex:1;min-width:0}
.summ-cat-name{font-size:13px;font-weight:600;color:var(--text)}
.summ-cat-count{font-size:11px;color:var(--text3);margin-top:1px}
.summ-cat-right{text-align:right;flex-shrink:0}
.summ-cat-amt{font-family:var(--font-head);font-size:15px;font-weight:700}
.summ-cat-pct{font-size:10px;color:var(--text3);margin-top:2px}
.summ-cat-bar-wrap{height:3px;background:rgba(255,255,255,.06);border-radius:99px;margin:0 14px 10px;overflow:hidden}
.summ-cat-bar-fill{height:100%;border-radius:99px}

/* expanded txn list inside summary */
.summ-txn-list{
  border-top:1px solid var(--card-border);
  background:var(--bg3);
}
.summ-txn-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.summ-txn-item:last-child{border-bottom:none}
.summ-txn-detail{flex:1;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summ-txn-date{font-size:11px;color:var(--text3);margin-top:1px}
.summ-txn-amt{font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--red);flex-shrink:0}

/* ── DATA PAGE ─────────────────────────── */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--card-border)}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:13px;color:var(--text2)}
.stat-val{font-family:var(--font-head);font-size:16px;font-weight:700}

.month-item{padding:10px 0;border-bottom:1px solid var(--card-border)}
.month-item:last-child{border-bottom:none}
.month-item-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.month-item-row{display:flex;gap:10px;font-family:var(--font-head);font-size:13px;font-weight:700}

/* ── CUSTOM CATS ─────────────────────────── */
.cc-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.cc-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:var(--radius-sm);padding:8px 10px}
.cc-item-ico{font-size:18px}
.cc-item-lbl{flex:1;font-size:13px;font-weight:600}
.cc-item-del{background:rgba(248,113,113,.12);color:var(--red);border:none;width:26px;height:26px;border-radius:6px;font-size:12px;display:flex;align-items:center;justify-content:center}
.cc-form{display:flex;gap:8px;align-items:center}
.cc-ico-inp{width:54px;text-align:center;font-size:20px;padding:10px 6px}
.cc-name-inp{flex:1}
.cc-add-btn{width:42px;height:42px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:22px;font-weight:700;flex-shrink:0}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s}
.swatch.picked{transform:scale(1.2);box-shadow:0 0 0 3px rgba(255,255,255,.25)}

/* ── EMPTY STATE ─────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;gap:12px}
.empty-ico{font-size:40px}
.empty-txt{text-align:center;color:var(--text3);font-size:13px;line-height:1.6}

/* ── TOAST ─────────────────────────── */
#toast{
  position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%) translateY(10px);
  background:rgba(240,244,255,.12);backdrop-filter:blur(20px);
  color:var(--text);padding:10px 18px;border-radius:99px;
  font-size:13px;font-weight:600;border:1px solid var(--card-border);
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;z-index:200;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <!-- PAGE: DASHBOARD -->
  <div id="page-dashboard" class="page active">
    <div class="hdr">
      <div class="hdr-left">
        <div class="hdr-wordmark">Money<em>Wise</em></div>
        <div class="hdr-sub">Track every rupee</div>
      </div>
    </div>
    <div id="dash-body"></div>
  </div>

  <!-- PAGE: ADD -->
  <div id="page-add" class="page">
    <div class="hdr">
      <div class="hdr-wordmark">Add <em id="add-mode-lbl">Expense</em></div>
    </div>
    <div id="add-body"></div>
  </div>

  <!-- PAGE: HISTORY -->
  <div id="page-history" class="page">
    <div class="hdr">
      <div class="hdr-wordmark">History</div>
    </div>
    <div id="hist-body"></div>
  </div>

  <!-- PAGE: SUMMARY -->
  <div id="page-summary" class="page">
    <div class="hdr">
      <div class="hdr-wordmark">Summary</div>
    </div>
    <div id="summ-body"></div>
  </div>

  <!-- PAGE: DATA -->
  <div id="page-data" class="page">
    <div class="hdr">
      <div class="hdr-wordmark">Data <em style="font-size:16px;color:var(--text2);font-weight:600">&amp; Export</em></div>
    </div>
    <div id="data-body"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="nav">
    <button class="nav-item active" id="nav-dashboard" onclick="navigate('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" id="nav-history" onclick="navigate('history')">

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function pad(n){ return String(n).padStart(2,'0'); }
function fmtCur(n){ return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(s){ return new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function monthLabel(mk){
  const [y,m]=mk.split('-');

}
function dateGroupLabel(s){
  const d=new Date(s+'T00:00:00');

  if(d.getTime()===t.getTime()) return 'Today';
  if(d.getTime()===y.getTime()) return 'Yesterday';
  return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function monthData(mk){

    expenses:D.expenses.filter(e=>e.date.startsWith(mk)),

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─────────────────────────────────────────
//   SUMMARY PERIOD HELPERS
// ─────────────────────────────────────────
// Returns {start, end} date strings for given period + offset
function periodRange(period, offset){
  const now = new Date();
  now.setHours(0,0,0,0);

  if(period === 'daily'){
    const d = new Date(now);
    d.setDate(d.getDate() + offset);
    const s = dateStr(d);
    return {start:s, end:s};
  }
  if(period === 'weekly'){
    // week starts Monday
    const dow = (now.getDay()+6)%7; // 0=Mon
    const mon = new Date(now);
    mon.setDate(now.getDate() - dow + offset*7);
    const sun = new Date(mon);
    sun.setDate(mon.getDate() + 6);
    return {start:dateStr(mon), end:dateStr(sun)};
  }
  if(period === 'monthly'){
    const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    const end = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return {start:dateStr(d), end:dateStr(end)};
  }
}
function dateStr(d){
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function periodLabel(period, offset){
  const {start,end} = periodRange(period, offset);
  if(period === 'daily'){
    if(offset===0) return 'Today';
    if(offset===-1) return 'Yesterday';
    return fmtDate(start);
  }
  if(period === 'weekly'){
    const s = new Date(start+'T00:00:00');
    const e = new Date(end+'T00:00:00');
    const fmt = d => d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
    const suffix = offset===0?' (This week)':offset===-1?' (Last week)':'';
    return fmt(s)+' – '+fmt(e)+suffix;
  }
  if(period === 'monthly'){
    const [y,m] = start.split('-');
    return new Date(+y,+m-1).toLocaleString('en-IN',{month:'long',year:'numeric'});
  }
}
function expensesInRange(start, end){
  return D.expenses.filter(e => e.date >= start && e.date <= end);
}
function revenueInRange(start, end){
  return D.revenue.filter(r => r.date >= start && r.date <= end);
}

  if(page==='add') fab.classList.add('on-add-page');

}

}

}

            Income

            Spent
          </div>
          <div class="hero-stat-amt" style="color:var(--red)">${fmtCur(totExp)}</div>
        </div>
      </div>
    </div>
    ${catArr.length?`
    <div class="card">
      <div class="section-title">By Category</div>
      ${catArr.map(([cat,amt])=>{
        const c=CATS[cat]||CATS.other;

function renderHistory(){
  let items=[];
  if(histFilt!=='revenue') items.push(...D.expenses.map(e=>({...e,_t:'exp'})));
  if(histFilt!=='expense') items.push(...D.revenue.map(r=>({...r,_t:'rev'})));
  items.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const byDate={};
  items.forEach(it=>{ (byDate[it.date]=byDate[it.date]||[]).push(it); });
  const dates=Object.keys(byDate).sort().reverse();
  document.getElementById('hist-body').innerHTML=`
    <div class="hist-filter">
      <div class="hist-chip ${histFilt==='all'?'active':''}" onclick="setFilt('all')">All</div>
      <div class="hist-chip ${histFilt==='expense'?'active':''}" onclick="setFilt('expense')">Expenses</div>
      <div class="hist-chip ${histFilt==='revenue'?'active':''}" onclick="setFilt('revenue')">Income</div>
    </div>
    ${dates.length===0
      ?`<div class="empty"><div class="empty-ico">📋</div><div class="empty-txt">Nothing here yet.</div></div>`
      :dates.map(dt=>`
        <div class="dg-hdr">${dateGroupLabel(dt)}</div>
        <div class="hist-card">${byDate[dt].map(t=>txnRow(t,true)).join('')}</div>`).join('')

}

// ═══════════════════════════════════════════
//   TRANSACTION ROW
// ═══════════════════════════════════════════
function txnRow(t, expandable){
  const isExp=t._t==='exp';
  const cat=isExp?(CATS[t.category]||CATS.other):null;
  const ico=isExp?cat.icon:'💰';
  const col=isExp?cat.color:'var(--green)';
  const name=isExp?cat.label:(t.source||'Income');
  const sub=t.detail||'';
  const sign=isExp?'−':'+';
  const amtC=isExp?'var(--red)':'var(--green)';
  const id=t.id;
  if(!expandable){
    return `<div class="txn-grp">
      <div class="txn-item" style="cursor:default">
        <div class="txn-ico" style="background:${col}1A">${ico}</div>
        <div class="txn-body"><div class="txn-name">${esc(name)}</div>${sub?`<div class="txn-sub">${esc(sub)}</div>`:''}</div>
        <div class="txn-right"><div class="txn-amt" style="color:${amtC}">${sign}${fmtCur(t.amount)}</div><div class="txn-date">${fmtDate(t.date)}</div></div>
      </div></div>`;
  }
  return `<div class="txn-grp expandable" id="grp-${id}">
    <div class="txn-item" onclick="toggleExpand('${id}')">
      <div class="txn-ico" style="background:${col}1A">${ico}</div>
      <div class="txn-body"><div class="txn-name">${esc(name)}</div>${sub?`<div class="txn-sub">${esc(sub)}</div>`:''}</div>
      <div class="txn-right" style="padding-right:18px">
        <div class="txn-amt" style="color:${amtC}">${sign}${fmtCur(t.amount)}</div>
        <div class="txn-date">${fmtDate(t.date)}</div>
      </div>
      <span class="txn-chev">▾</span>
    </div>
    <div class="txn-expand">
      <div class="expand-inner">
        <div class="expand-info">
          ${sub?`<div><strong>Detail:</strong> ${esc(sub)}</div>`:''}
          ${isExp?`<div><strong>Category:</strong> ${esc(cat.label)}</div>`:`<div><strong>Source:</strong> ${esc(t.source||'')}</div>`}
          <div><strong>Date:</strong> ${fmtDate(t.date)}</div>
          <div><strong>Amount:</strong> <span style="color:${amtC}">${sign}${fmtCur(t.amount)}</span></div>
        </div>
        <button class="btn-del-sm" onclick="event.stopPropagation();delEntry('${id}','${t._t}')">Delete</button>
      </div>
    </div>
  </div>`;
}
function toggleExpand(id){
  document.getElementById('grp-'+id)?.classList.toggle('open');
}
function delEntry(id,type){
  if(!confirm('Delete this entry?')) return;
  if(type==='exp') D.expenses=D.expenses.filter(e=>e.id!==id);
  else D.revenue=D.revenue.filter(r=>r.id!==id);
  saveData(); renderHistory(); toast('Deleted');
}

// ═══════════════════════════════════════════
//   SUMMARY PAGE
// ═══════════════════════════════════════════
function renderSummary(){
  summExpanded = summExpanded || {};
  const {start, end} = periodRange(summPeriod, summOffset);
  const expenses = expensesInRange(start, end);
  const revenue  = revenueInRange(start, end);

  const totExp = expenses.reduce((s,e)=>s+e.amount, 0);
  const totRev = revenue.reduce((s,r)=>s+r.amount, 0);
  const net = totRev - totExp;

  // Group expenses by category
  const byCat = {};
  expenses.forEach(e=>{
    if(!byCat[e.category]) byCat[e.category]=[];
    byCat[e.category].push(e);
  });
  const catArr = Object.entries(byCat)
    .map(([k,items])=>({key:k,items,total:items.reduce((s,e)=>s+e.amount,0)}))
    .sort((a,b)=>b.total-a.total);
  const maxCatAmt = catArr[0]?.total || 1;

  // Group revenue by source
  const bySource = {};
  revenue.forEach(r=>{
    const k = r.source||'Other Income';
    if(!bySource[k]) bySource[k]=[];
    bySource[k].push(r);
  });
  const srcArr = Object.entries(bySource)
    .map(([k,items])=>({key:k,items,total:items.reduce((s,r)=>s+r.amount,0)}))
    .sort((a,b)=>b.total-a.total);

  const nc = net>=0?'var(--green)':'var(--red)';
  const periodLbl = periodLabel(summPeriod, summOffset);
  const canGoForward = summOffset < 0;

  document.getElementById('summ-body').innerHTML=`

    <!-- Period selector -->
    <div class="summ-period-bar">
      <button class="summ-period-btn ${summPeriod==='daily'?'active':''}" onclick="setSummPeriod('daily')">Day</button>
      <button class="summ-period-btn ${summPeriod==='weekly'?'active':''}" onclick="setSummPeriod('weekly')">Week</button>
      <button class="summ-period-btn ${summPeriod==='monthly'?'active':''}" onclick="setSummPeriod('monthly')">Month</button>
    </div>

    <!-- Period navigator -->
    <div class="summ-nav">
      <button class="summ-nav-btn" onclick="shiftSummOffset(-1)">‹</button>
      <div class="summ-nav-lbl">${esc(periodLbl)}</div>
      <button class="summ-nav-btn" onclick="shiftSummOffset(1)" ${!canGoForward?'style="opacity:.3;pointer-events:none"':''}>›</button>
    </div>

    <!-- Hero -->
    <div class="summ-hero">
      <div class="hero-lbl">Net Balance</div>
      <div class="hero-amt" style="color:${nc};font-family:var(--font-head);font-size:34px;font-weight:800;line-height:1;margin-bottom:0">${fmtCur(net)}</div>
      <div class="summ-hero-row">
        <div class="summ-stat">
          <div class="summ-stat-lbl" style="color:var(--green)">Income</div>
          <div class="summ-stat-val" style="color:var(--green)">${fmtCur(totRev)}</div>
        </div>
        <div class="summ-stat">
          <div class="summ-stat-lbl" style="color:var(--red)">Spent</div>
          <div class="summ-stat-val" style="color:var(--red)">${fmtCur(totExp)}</div>
        </div>
        <div class="summ-stat">
          <div class="summ-stat-lbl">Transactions</div>
          <div class="summ-stat-val">${expenses.length + revenue.length}</div>
        </div>

    </div>

    <!-- Expenses by Category -->
    ${catArr.length ? `
    <div class="summ-cat-section">
      <div class="summ-cat-hdr">Expenses by Category</div>
      ${catArr.map(({key,items,total})=>{
        const c = CATS[key]||CATS.other;
        const pct = totExp ? Math.round(total/totExp*100) : 0;
        const barW = (total/maxCatAmt*100).toFixed(1);
        const isOpen = !!summExpanded[key];
        const avgPer = items.length ? total/items.length : 0;
        return `<div class="summ-cat-card">
          <div class="summ-cat-row" onclick="toggleSummCat('${key}')">
            <div class="summ-cat-ico-wrap" style="background:${c.color}1A">${c.icon}</div>
            <div class="summ-cat-info">
              <div class="summ-cat-name">${esc(c.label)}</div>
              <div class="summ-cat-count">${items.length} transaction${items.length!==1?'s':''} · avg ${fmtCur(avgPer)}</div>
            </div>
            <div class="summ-cat-right">
              <div class="summ-cat-amt" style="color:var(--red)">−${fmtCur(total)}</div>
              <div class="summ-cat-pct">${pct}% of spend</div>
            </div>
            <span style="color:var(--text3);font-size:12px;margin-left:6px;transition:transform .2s;display:inline-block;transform:rotate(${isOpen?180:0}deg)">▾</span>
          </div>
          <div class="summ-cat-bar-wrap">
            <div class="summ-cat-bar-fill" style="width:${barW}%;background:${c.color}"></div>
          </div>
          ${isOpen ? `<div class="summ-txn-list">
            ${items.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`
              <div class="summ-txn-item">
                <div style="flex:1;min-width:0">
                  <div class="summ-txn-detail">${esc(e.detail)||'—'}</div>
                  <div class="summ-txn-date">${fmtDate(e.date)}</div>
                </div>
                <div class="summ-txn-amt">−${fmtCur(e.amount)}</div>
              </div>`).join('')}
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>` : `<div class="empty"><div class="empty-ico">📊</div><div class="empty-txt">No expenses in this period.</div></div>`
    }

    <!-- Income by Source -->
    ${srcArr.length ? `
    <div class="summ-cat-section">
      <div class="summ-cat-hdr">Income by Source</div>
      ${srcArr.map(({key,items,total})=>{
        const isOpen = !!summExpanded['rev_'+key];
        const avgPer = items.length ? total/items.length : 0;
        return `<div class="summ-cat-card">
          <div class="summ-cat-row" onclick="toggleSummCat('rev_${key.replace(/'/g,"\\'")}')">
            <div class="summ-cat-ico-wrap" style="background:rgba(52,211,153,.12)">💰</div>
            <div class="summ-cat-info">
              <div class="summ-cat-name">${esc(key)}</div>
              <div class="summ-cat-count">${items.length} transaction${items.length!==1?'s':''} · avg ${fmtCur(avgPer)}</div>
            </div>
            <div class="summ-cat-right">
              <div class="summ-cat-amt" style="color:var(--green)">+${fmtCur(total)}</div>
              <div class="summ-cat-pct">${totRev?Math.round(total/totRev*100):0}% of income</div>
            </div>
            <span style="color:var(--text3);font-size:12px;margin-left:6px;transition:transform .2s;display:inline-block;transform:rotate(${isOpen?180:0}deg)">▾</span>
          </div>
          ${isOpen ? `<div class="summ-txn-list">
            ${items.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`
              <div class="summ-txn-item">
                <div style="flex:1;min-width:0">
                  <div class="summ-txn-detail">${esc(r.detail)||'—'}</div>
                  <div class="summ-txn-date">${fmtDate(r.date)}</div>
                </div>
                <div class="summ-txn-amt" style="color:var(--green)">+${fmtCur(r.amount)}</div>
              </div>`).join('')}
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>` : ''
    }

    <div style="height:8px"></div>
  `;
}

function setSummPeriod(p){
  summPeriod = p;
  summOffset = 0;
  summExpanded = {};
  renderSummary();
}
function shiftSummOffset(d){
  summOffset = Math.min(0, summOffset + d);
  summExpanded = {};
  renderSummary();
}
function toggleSummCat(key){
  summExpanded[key] = !summExpanded[key];
  renderSummary();
}

// ═══════════════════════════════════════════
//   DATA PAGE
// ═══════════════════════════════════════════
function renderData(){
  const totE=D.expenses.reduce((s,e)=>s+e.amount,0);
  const totR=D.revenue.reduce((s,r)=>s+r.amount,0);
  const net=totR-totE;
  const months=new Set([...D.expenses.map(e=>e.date.slice(0,7)),...D.revenue.map(r=>r.date.slice(0,7))]);
  const mArr=[...months].sort().reverse().slice(0,6);
  const customCats=Object.entries(CATS).filter(([,v])=>v.custom);

  document.getElementById('data-body').innerHTML=`
    <div class="card">
      <div class="section-title">All-Time</div>
      <div class="stat-row"><span class="stat-label">Total Income</span><span class="stat-val" style="color:var(--green)">${fmtCur(totR)}</span></div>
      <div class="stat-row"><span class="stat-label">Total Expenses</span><span class="stat-val" style="color:var(--red)">${fmtCur(totE)}</span></div>
      <div class="stat-row"><span class="stat-label" style="font-weight:700;color:var(--text)">Net Balance</span><span class="stat-val" style="color:${net>=0?'var(--green)':'var(--red)'}">${fmtCur(net)}</span></div>
    </div>

    ${mArr.length?`
    <div class="card">
      <div class="section-title">Monthly</div>
      ${mArr.map(mk=>{
        const {expenses:me,revenue:mr}=monthData(mk);
        const et=me.reduce((s,e)=>s+e.amount,0);
        const rt=mr.reduce((s,r)=>s+r.amount,0);
        const n=rt-et;
        return `<div class="month-item">
          <div class="month-item-name">${monthLabel(mk)}</div>
          <div class="month-item-row">
            <span style="color:var(--green)">+${fmtCur(rt)}</span>
            <span style="color:var(--red)">−${fmtCur(et)}</span>
            <span style="color:${n>=0?'var(--green)':'var(--red)'}">= ${fmtCur(n)}</span>
          </div>
        </div>`;
      }).join('')}
    </div>`:''
    }

    <div class="card">
      <div class="section-title">Categories</div>
      <div style="color:var(--text2);font-size:12px;margin-bottom:12px;">Add your own types — they show up everywhere.</div>
      ${customCats.length?`
      <div class="cc-list">
        ${customCats.map(([k,v])=>`
          <div class="cc-item">
            <span class="cc-item-ico">${v.icon}</span>
            <span class="cc-item-lbl" style="color:${v.color}">${esc(v.label)}</span>
            <button class="cc-item-del" onclick="delCustomCat('${k}')" title="Delete">✕</button>
          </div>`).join('')}
      </div>`:''}
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;">New Category</div>
      <div class="cc-form">
        <input class="inp cc-ico-inp" id="cc-icon" maxlength="4" placeholder="🏷️">
        <input class="inp cc-name-inp" id="cc-name" placeholder="e.g. Family, Pets, Gym…" autocomplete="off">
        <button class="cc-add-btn" onclick="addCustomCat()">+</button>
      </div>
      <div style="margin-top:8px;">
        <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;">Pick a colour</div>
        <div class="swatch-row" id="swatch-row">
          ${SWATCH_COLORS.map(c=>`<div class="swatch ${c===selSwatchColor?'picked':''}" style="background:${c}" onclick="pickSwatch('${c}')"></div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Export</div>
      <div style="color:var(--text2);font-size:13px;margin-bottom:14px;line-height:1.6;">One Excel file — each month is its own sheet, expenses grouped by category with subtotals and totals.</div>
      <button class="btn btn-primary" onclick="exportExcel()">📥 &nbsp;Export to Excel</button>
    </div>

    <div class="card">
      <div class="section-title">Import</div>
      <div style="color:var(--text2);font-size:13px;margin-bottom:14px;line-height:1.6;">Restore from a previously exported file. Duplicates are skipped.</div>
      <input type="file" id="imp-file" accept=".xlsx,.xls" style="display:none" onchange="handleImport(this)">
      <button class="btn btn-ghost" onclick="document.getElementById('imp-file').click()">📤 &nbsp;Import Excel File</button>
    </div>

    <div class="card" style="border-color:rgba(248,113,113,.18);margin-bottom:16px;">
      <div class="section-title" style="color:var(--red)">Danger Zone</div>
      <div style="color:var(--text2);font-size:13px;margin-bottom:14px;">Remove all data from this device. Cannot be undone.</div>
      <button class="btn btn-danger" onclick="clearAll()">🗑️ &nbsp;Clear All Data</button>
    </div>

    <div style="text-align:center;color:var(--text3);font-size:11px;padding:4px 0 8px;">
      ${D.expenses.length} expenses · ${D.revenue.length} income entries
    </div>
  `;
}

// ═══════════════════════════════════════════
//   CUSTOM CATEGORIES
// ═══════════════════════════════════════════
function pickSwatch(c){
  selSwatchColor=c;
  document.querySelectorAll('.swatch').forEach(el=>{ el.classList.toggle('picked',el.style.background===c); });
}
function addCustomCat(){
  const ico=(document.getElementById('cc-icon').value.trim()||'🏷️');
  const name=document.getElementById('cc-name').value.trim();
  if(!name){ toast('Enter a category name'); return; }
  const key='custom_'+uid();
  CATS[key]={label:name,icon:ico,color:selSwatchColor,custom:true};
  CAT_KEYS=Object.keys(CATS);
  saveCustomCats(); toast(`"${name}" added`); renderData();
}
function delCustomCat(key){
  if(!confirm(`Delete "${CATS[key]?.label}"?`)) return;
  delete CATS[key]; CAT_KEYS=Object.keys(CATS); saveCustomCats();
  if(selCat===key) selCat='other'; toast('Category deleted'); renderData();
}

// ═══════════════════════════════════════════
//   EXPORT
// ═══════════════════════════════════════════
function exportExcel(){
  if(!window.XLSX){ toast('XLSX library not loaded'); return; }
  const wb=XLSX.utils.book_new();
  const allMonths=new Set([...D.expenses.map(e=>e.date.slice(0,7)),...D.revenue.map(r=>r.date.slice(0,7))]);
  if(!allMonths.size){ toast('No data to export'); return; }
  [...allMonths].sort().forEach(mk=>{
    const {expenses,revenue}=monthData(mk);
    const rows=[];
    rows.push(['EXPENSES','','','']);
    rows.push(['Type','Detail','Date','Amount (₹)']);
    const byCat={};
    expenses.forEach(e=>{ (byCat[e.category]=byCat[e.category]||[]).push(e); });
    let totE=0;
    Object.entries(byCat).sort().forEach(([cat,items])=>{
      const lbl=CATS[cat]?.label||cat;
      items.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{ rows.push([lbl,e.detail||'',fmtDate(e.date),e.amount]); });
      const sub=items.reduce((s,e)=>s+e.amount,0); totE+=sub;
      rows.push([lbl+' Total','','',sub]); rows.push(['','','','']);
    });
    rows.push(['MONTHLY EXPENSES TOTAL','','',totE]); rows.push(['','','','']); rows.push(['','','','']);
    rows.push(['REVENUE','','','']); rows.push(['Source','Detail','Date','Amount (₹)']);
    let totR=0;
    revenue.sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{ rows.push([r.source||'',r.detail||'',fmtDate(r.date),r.amount]); totR+=r.amount; });
    rows.push(['REVENUE TOTAL','','',totR]); rows.push(['','','','']);
    rows.push(['NET BALANCE (Revenue − Expenses)','','',totR-totE]);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:28},{wch:36},{wch:16},{wch:16}];
    const [y,m]=mk.split('-');
    const sname=new Date(+y,m-1).toLocaleString('en',{month:'short'})+' '+y;
    XLSX.utils.book_append_sheet(wb,ws,sname);
  });
  XLSX.writeFile(wb,'MoneyWise_expenses.xlsx'); toast('Exported ✓');
}

// ═══════════════════════════════════════════
//   IMPORT
// ═══════════════════════════════════════════
function handleImport(inp){
  if(!inp.files[0]) return;
  const file=inp.files[0]; inp.value='';
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',raw:true});
      let addedE=0,addedR=0;
      wb.SheetNames.forEach(sname=>{
        const ws=wb.Sheets[sname];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
        let inRev=false;
        rows.forEach(row=>{
          const c0=String(row[0]||'').trim(),c1=String(row[1]||'').trim(),c2=String(row[2]||'').trim(),c3=row[3];
          const amt=typeof c3==='number'?c3:parseFloat(c3);
          if(!c0) return;
          if(c0==='EXPENSES'||c0==='Type'||c0==='Source'||c0==='Detail') return;
          if(c0==='REVENUE'){ inRev=true; return; }
          if(c0.endsWith(' Total')||c0==='MONTHLY EXPENSES TOTAL'||c0==='REVENUE TOTAL'||c0.startsWith('NET BALANCE')) return;
          if(isNaN(amt)||amt<=0) return;
          const date=parseImportDate(c2)||todayStr();
          if(inRev){
            const dup=D.revenue.some(r=>r.source===c0&&r.detail===c1&&r.date===date&&r.amount===amt);
            if(!dup){ D.revenue.push({id:uid(),source:c0,detail:c1,date,amount:amt}); addedR++; }
          } else {
            let catKey='other';
            for(const [k,v] of Object.entries(CATS)){ if(v.label===c0||k===c0.toLowerCase()){ catKey=k; break; } }
            const dup=D.expenses.some(e=>e.category===catKey&&e.detail===c1&&e.date===date&&e.amount===amt);
            if(!dup){ D.expenses.push({id:uid(),category:catKey,detail:c1,date,amount:amt}); addedE++; }
          }
        });
      });
      saveData(); toast(`Imported ${addedE} expenses, ${addedR} income`); renderPage(curPage);
    }catch(err){ toast('Import failed — check file format'); console.error(err); }
  };
  reader.readAsArrayBuffer(file);
}
function parseImportDate(str){
  if(!str) return null; str=String(str).trim(); if(!str) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const m=str.match(/(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})/);
  if(m){ const mi=MONTHS.findIndex(mo=>m[2].toLowerCase().startsWith(mo)); if(mi!==-1) return `${m[3]}-${pad(mi+1)}-${pad(m[1])}`; }
  const serial=Number(str);
  if(!isNaN(serial)&&serial>30000){ const d=new Date(Math.round((serial-25569)*86400*1000)); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
  const d=new Date(str);
  if(!isNaN(d.getTime())) return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  return null;
}

// ═══════════════════════════════════════════
//   MISC
// ═══════════════════════════════════════════
function clearAll(){
  if(!confirm('Delete ALL data permanently? This cannot be undone.')) return;
  D={expenses:[],revenue:[]}; saveData(); toast('All data cleared'); renderPage(curPage);
}
let _tTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_tTimer); _tTimer=setTimeout(()=>el.classList.remove('show'),2600);
}

loadCustomCats();
